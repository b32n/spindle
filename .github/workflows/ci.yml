name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  packages:
    name: Packages · Node ${{ matrix.node }} (build · type-check · test · lint)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # npm ci/install omit Rollup's platform-native optional dep in a
      # workspace root (npm/cli#4828), so `rollup -c` fails to load
      # @rollup/rollup-linux-x64-gnu. Install it explicitly at Rollup's exact
      # version; the runner is always linux-x64. --no-save leaves the lockfile
      # untouched.
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      # Build first: cross-package types resolve through each package's built
      # dist/*.d.ts, so type-check must run against a built tree.
      - run: npm run build
      - run: npm run type-check
      - run: npm test
      # DOCX fidelity corpus against the built packages (goldens in fixtures/docx/goldens). Fails on
      # snapshot drift; also writes a per-file loss / round-trip summary to the job summary and a
      # JSON report for the artifact below.
      - name: DOCX fidelity corpus
        run: npm run docs:docx-fidelity -- --report md --report-out "$GITHUB_STEP_SUMMARY" --report json --report-out docx-fidelity-report.json
      - name: Upload DOCX fidelity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docx-fidelity-report-node${{ matrix.node }}
          path: docx-fidelity-report.json
          if-no-files-found: ignore
          retention-days: 14
      - run: npm run lint
      # Library source must not fetch anything or hard-code third-party hosts (docs/testing: privacy).
      - run: npm run check:network

  website:
    name: Website (type-check · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # The website consumes every spindle package via file: deps (local
      # monorepo, pre-publish), so all of their dist must be built before the
      # website resolves them.
      - run: npm ci
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm run build
      - run: npm ci
        working-directory: website
      - run: npm run typecheck
        working-directory: website
      - run: npm run build
        working-directory: website

  examples:
    name: Examples (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      # Examples alias the packages' src, but type-check against built dist.
      - run: npm run build
      - name: Build examples
        run: |
          for d in docs-demo sheets-demo slides-demo; do
            (cd examples/$d && npm ci && npm run build)
          done
          (cd examples/collab-server && npm ci && npx tsc --noEmit)
