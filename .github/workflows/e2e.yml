name: E2E

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm ci omits Rollup's platform-native optional dep in a workspace root
      # (npm/cli#4828); same workaround as ci.yml. Vite (the demo servers) needs it.
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      # The demos alias the packages' src/, but build keeps parity with ci.yml
      # and guards against build-only breakage reaching the demos.
      - run: npm run build
      # retries=2, failOnFlakyTests and the blob reporter are enabled by CI=true in
      # playwright.config.ts: a test that only passes on a retry fails its shard.
      - name: Run Playwright (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
      - name: Upload traces, screenshots and videos (failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts-${{ matrix.shard }}
          path: e2e/.results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # Visual regression: toHaveScreenshot on Chromium only (e2e/visual). The baselines in
  # e2e/visual/__screenshots__ are made by this very job, inside the pinned Playwright container
  # (mcr.microsoft.com/playwright:v1.64.1-noble); see docs/testing to update them.
  visual:
    name: Visual (chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - name: Run the visual project
        run: npx playwright test --project=visual
        env:
          PW_VISUAL: '1'
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-visual
          path: blob-report
          retention-days: 7
      # A mismatch leaves *-actual.png / *-diff.png under e2e/.results; a missing baseline is written
      # straight to e2e/visual/__screenshots__. Either way, copy the new PNG over
      # e2e/visual/__screenshots__/<name>.png to accept it (see docs/testing).
      - name: Upload actual/diff images and traces (failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failure-artifacts
          path: |
            e2e/.results
            e2e/visual/__screenshots__
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [e2e, visual]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
      # List flaky tests (passed only on a retry) in the job summary. The shards already
      # fail on them (failOnFlakyTests); this makes the culprits easy to find.
      - name: Flaky test summary
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=report.json npx playwright merge-reports --reporter=json ./all-blob-reports
          node scripts/testing/flaky-summary.mjs report.json
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14

  # Production-build smoke: the @smoke subset on Chromium against `vite build` + `vite preview`
  # of the three demos, so build-only breakage (minification, tree-shaking, chunking, missing
  # assets) is caught, not just what the dev servers serve.
  preview-smoke:
    name: Production build smoke (@smoke, chromium)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm run build:demos
      - name: Run @smoke against the production builds
        run: npx playwright test --grep @smoke --project=chromium
        env:
          PW_TARGET: preview
      - name: Upload traces, screenshots and videos (failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: preview-smoke-failure-artifacts
          path: e2e/.results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

  # Stable, single status to mark as a required check (the sharded job names
  # above change if the matrix changes). Fails if any shard, the visual job or the production
  # smoke failed or was cancelled, or if the generated scenario map is stale.
  e2e-result:
    name: e2e-result
    if: ${{ always() }}
    needs: [e2e, preview-smoke, visual]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          echo "e2e: ${{ needs.e2e.result }}"
          echo "preview-smoke: ${{ needs.preview-smoke.result }}"
          echo "visual: ${{ needs.visual.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] && [ "${{ needs.preview-smoke.result }}" = "success" ] && [ "${{ needs.visual.result }}" = "success" ]
      # docs/testing/scenarios.md is generated from the specs; fail if it drifted.
      # (Plain node script, no install needed.)
      - uses: actions/checkout@v4
        if: ${{ always() }}
      - uses: actions/setup-node@v4
        if: ${{ always() }}
        with:
          node-version: 22
      - name: Scenario map is up to date
        if: ${{ always() }}
        run: node scripts/testing/scenarios.mjs --check || { echo "::error::docs/testing/scenarios.md is stale; run 'npm run docs:scenarios' and commit"; exit 1; }
