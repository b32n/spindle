name: E2E nightly (flake hunt)

# Runs the whole suite on all three browsers with no retries, each test 5 times.
# Anything that fails in any repeat is flaky (or broken) and is listed in the job
# summary and as annotations. Not a required check; it exists to find flakiness
# that the single, retried PR run can hide.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      repeat_each:
        description: 'Repeats per test'
        default: '5'

jobs:
  e2e:
    name: Nightly (shard ${{ matrix.shard }}/6)
    if: github.repository == 'b32n/spindle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Rollup native binary (npm workspace bug workaround)
        run: |
          ROLLUP_VERSION="$(node -p "require('rollup/package.json').version")"
          npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@${ROLLUP_VERSION}"
      - run: npm run build
      - name: Get Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install browsers (with system deps)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Install system deps only (browsers cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      - name: Run Playwright (no retries, repeated)
        run: npx playwright test --shard=${{ matrix.shard }}/6 --retries=0 --repeat-each=${{ inputs.repeat_each || 5 }}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
      - name: Upload traces, screenshots and videos (failures)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-failure-artifacts-${{ matrix.shard }}
          path: e2e/.results
          retention-days: 7
          if-no-files-found: ignore

  report:
    name: Flake summary
    if: ${{ !cancelled() && github.repository == 'b32n/spindle' }}
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Summarise flaky / failing tests
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=report.json npx playwright merge-reports --reporter=json ./all-blob-reports
          node scripts/testing/flaky-summary.mjs report.json
      - run: npx playwright merge-reports --reporter=html ./all-blob-reports
        if: ${{ always() }}
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14
